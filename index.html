<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus Flux — три слоя</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050510;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* RGB фон */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(125deg, #ff3366, #ff6633, #33ff66, #33ffcc, #3366ff, #cc33ff, #ff33cc);
            background-size: 400% 400%;
            animation: rgbFlow 18s ease infinite;
            filter: brightness(1.1) saturate(1.2);
        }
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
            backdrop-filter: blur(2px);
            z-index: -1;
            pointer-events: none;
        }
        .rgb-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: -1;
            animation: floatOrb 22s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb1 { width: 45vw; height: 45vw; background: radial-gradient(circle, rgba(255,80,120,0.8), rgba(255,40,200,0.4)); top: 10%; left: -15%; animation-duration: 24s; }
        .orb2 { width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(80,255,180,0.7), rgba(0,200,255,0.3)); bottom: -20%; right: -20%; animation-duration: 28s; animation-delay: -5s; }
        .orb3 { width: 35vw; height: 35vw; background: radial-gradient(circle, rgba(255,220,80,0.9), rgba(255,80,80,0.5)); top: 50%; left: 60%; animation-duration: 30s; animation-delay: -10s; filter: blur(90px); }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatOrb {
            0% { transform: translate(0,0) scale(1); opacity:0.4; }
            100% { transform: translate(8%,12%) scale(1.1); opacity:0.7; }
        }

        /* Главный контейнер */
        .app-wrapper {
            width: 98vw;
            max-width: 1600px;
            height: 95vh;
            margin: 0.8rem;
            background: rgba(18,18,35,0.55);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Боковая панель навигации */
        .sidebar-nav {
            width: 260px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            padding: 1rem 0;
        }
        .sidebar-nav .brand {
            padding: 1rem 1.5rem;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #ffaaff, #aaffff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }
        .nav-item {
            padding: 0.8rem 1.5rem;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-item i { width: 24px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active {
            background: rgba(59,110,255,0.3);
            color: white;
            border-left-color: #3b6eff;
        }

        /* Область контента */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Заголовок слоя */
        .layer-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .layer-header h2 {
            color: white;
            font-size: 1.4rem;
        }
        .layer-header p {
            color: #aaa;
            font-size: 0.8rem;
        }

        .layer-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* ============ СОЦ. СЕТЬ (мессенджер) ============ */
        .chat-layout {
            display: flex;
            height: 100%;
            gap: 1rem;
        }
        .contact-list {
            width: 280px;
            background: rgba(0,0,0,0.2);
            border-radius: 1rem;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .contact-item:hover { background: rgba(255,255,255,0.1); }
        .contact-item.active { background: rgba(59,110,255,0.3); }
        .contact-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: #555; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; background-size: cover;
        }
        .contact-info { flex: 1; }
        .contact-name { color: #eee; font-weight: 500; }
        .contact-preview { color: #aaa; font-size: 0.7rem; }

        .chat-window {
            flex: 1;
            background: url('https://zefirka.club/uploads/posts/2022-09/1663555543_3-zefirka-club-p-oboi-dlya-chata-telegramm-3.jpg') center/cover no-repeat;
            border-radius: 1rem;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .chat-window::before {
            content: '';
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            pointer-events: none;
            border-radius: 1rem;
        }
        .chat-messages {
            position: relative;
            z-index: 2;
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .message-bubble {
            background: rgba(30,30,50,0.85);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            color: white;
            max-width: 70%;
            align-self: flex-start;
        }
        .message-bubble.own {
            align-self: flex-end;
            background: linear-gradient(95deg, #3b6eff, #9a3bff);
        }
        .chat-input-area {
            position: relative;
            z-index: 2;
            padding: 0.8rem;
            display: flex;
            gap: 0.5rem;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }
        .chat-input {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            color: white;
            outline: none;
        }
        .chat-send {
            background: linear-gradient(95deg, #3b6eff, #9a3bff);
            border: none;
            border-radius: 2rem;
            padding: 0 1.2rem;
            color: white;
            cursor: pointer;
        }

        /* ============ ФОРУМ ============ */
        .forum-categories {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .forum-category {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 1rem;
            flex: 1 1 200px;
            cursor: pointer;
            transition: 0.2s;
        }
        .forum-category:hover { background: rgba(255,255,255,0.1); }
        .forum-category h3 { color: white; }
        .forum-category p { color: #aaa; font-size: 0.8rem; }

        .forum-topics {
            margin-top: 1rem;
        }
        .forum-topic {
            background: rgba(0,0,0,0.2);
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .forum-topic:hover { background: rgba(255,255,255,0.05); }
        .forum-topic .title { color: white; font-weight: 500; }
        .forum-topic .meta { color: #aaa; font-size: 0.7rem; }

        /* ============ МАЙН СЕРВЕР ============ */
        .minecraft-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
        }
        .stat-card .value {
            font-size: 2rem;
            color: #ffd700;
            font-weight: bold;
        }
        .stat-card .label {
            color: #aaa;
            font-size: 0.8rem;
        }

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .player-item {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-item .rank { font-weight: bold; }
        .player-item .name { color: white; }

        /* Адаптив */
        @media (max-width: 768px) {
            .sidebar-nav { width: 80px; }
            .sidebar-nav .brand { font-size: 0; }
            .sidebar-nav .brand::before { content: "⚡"; font-size: 2rem; }
            .nav-item span { display: none; }
            .nav-item i { font-size: 1.4rem; }
            .chat-layout { flex-direction: column; }
            .contact-list { width: 100%; max-height: 200px; }
            .layer-content { padding: 0.5rem; }
            .forum-categories { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="overlay-dark"></div>
    <div class="rgb-orb orb1"></div>
    <div class="rgb-orb orb2"></div>
    <div class="rgb-orb orb3"></div>

    <div class="app-wrapper" id="appWrapper">
        <!-- Боковая навигация -->
        <nav class="sidebar-nav" id="sidebarNav">
            <div class="brand">⚡ Nexus Flux</div>
            <div class="nav-item active" data-layer="social"><i class="fas fa-comment"></i><span> Соц. сеть</span></div>
            <div class="nav-item" data-layer="forum"><i class="fas fa-comments"></i><span> Форум</span></div>
            <div class="nav-item" data-layer="minecraft"><i class="fas fa-cube"></i><span> Майн сервер</span></div>
            <div style="flex:1;"></div>
            <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span> Выйти</span></div>
        </nav>

        <!-- Контент -->
        <div class="content-area" id="contentArea">
            <!-- Сюда будет динамически загружаться контент -->
        </div>
    </div>

    <script>
        // ======================== ДАННЫЕ (localStorage) ========================
        let users = JSON.parse(localStorage.getItem('nf_users') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('nf_currentUser') || 'null');

        let messages = JSON.parse(localStorage.getItem('nf_messages') || '[]');

        let forumData = JSON.parse(localStorage.getItem('nf_forum') || JSON.stringify({
            categories: [
                { id: 1, name: 'Общий', desc: 'Всё подряд' },
                { id: 2, name: 'Помощь', desc: 'Технические вопросы' },
                { id: 3, name: 'Предложения', desc: 'Идеи для платформы' }
            ],
            topics: [
                { id: 1, categoryId: 1, title: 'Добро пожаловать!', author: 'admin', posts: [{ author: 'admin', text: 'Приветствуем на форуме!', date: Date.now() }] }
            ]
        }));

        let minecraftData = JSON.parse(localStorage.getItem('nf_minecraft') || JSON.stringify({
            online: 12,
            maxPlayers: 50,
            tps: 19.8,
            players: [
                { name: 'Steve', rank: 'Владелец', color: '#ffaa00' },
                { name: 'Alex', rank: 'Админ', color: '#ff5555' },
                { name: 'DarkSoul', rank: 'Модератор', color: '#55ff55' },
                { name: 'MinerPro', rank: 'Игрок', color: '#aaaaff' },
                { name: 'BuilderMax', rank: 'Игрок', color: '#aaaaff' },
                { name: 'CreeperKing', rank: 'Игрок', color: '#aaaaff' },
                { name: 'RedstoneGuru', rank: 'Игрок', color: '#aaaaff' },
                { name: 'Survivor123', rank: 'Игрок', color: '#aaaaff' },
                { name: 'HunterX', rank: 'Игрок', color: '#aaaaff' },
                { name: 'FarmerJoe', rank: 'Игрок', color: '#aaaaff' },
                { name: 'Architect', rank: 'Игрок', color: '#aaaaff' },
                { name: 'PvPChampion', rank: 'Игрок', color: '#aaaaff' }
            ]
        }));

        function saveAll() {
            localStorage.setItem('nf_users', JSON.stringify(users));
            localStorage.setItem('nf_currentUser', JSON.stringify(currentUser));
            localStorage.setItem('nf_messages', JSON.stringify(messages));
            localStorage.setItem('nf_forum', JSON.stringify(forumData));
            localStorage.setItem('nf_minecraft', JSON.stringify(minecraftData));
        }

        // ======================== РЕНДЕР КОНТЕНТА ========================
        function renderLayer(layer) {
            const container = document.getElementById('contentArea');
            if (!container) return;

            // Если пользователь не залогинен, показываем вход, кроме случая, когда это сам логин (чтобы не зациклить)
            if (!currentUser && layer !== 'login') {
                renderLogin(container);
                return;
            }

            switch (layer) {
                case 'social': return renderSocial(container);
                case 'forum': return renderForum(container);
                case 'minecraft': return renderMinecraft(container);
                case 'login': return renderLogin(container);
                default: container.innerHTML = '<div style="color:white;padding:2rem;">Слой не найден</div>';
            }
        }

        // ==================== ВХОД / РЕГИСТРАЦИЯ ====================
        function renderLogin(container) {
            container.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100%;">
                    <div style="background:rgba(0,0,0,0.5); padding:2rem; border-radius:2rem; width:100%; max-width:400px; text-align:center;">
                        <h2 style="color:white;">Вход в Nexus Flux</h2>
                        <input id="loginEmail" class="chat-input" style="width:100%; margin:0.5rem 0;" placeholder="Email">
                        <input id="loginPassword" type="password" class="chat-input" style="width:100%; margin:0.5rem 0;" placeholder="Пароль">
                        <button id="loginBtn" class="chat-send" style="width:100%; margin:0.5rem 0;">Войти</button>
                        <p style="color:#aaa;font-size:0.8rem;">Нет аккаунта? <span id="toRegister" style="color:#3b6eff;cursor:pointer;">Регистрация</span></p>
                        <div id="loginMessage" style="color:#ff8888;margin-top:0.5rem;"></div>
                    </div>
                </div>
            `;
            document.getElementById('loginBtn').onclick = () => {
                const email = document.getElementById('loginEmail').value;
                const pass = document.getElementById('loginPassword').value;
                const found = users.find(u => u.email === email && u.password === pass);
                if (found) {
                    currentUser = found;
                    saveAll();
                    renderLayer('social');
                } else {
                    document.getElementById('loginMessage').innerText = 'Неверный email или пароль';
                }
            };
            document.getElementById('toRegister').onclick = () => renderRegister(container);
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100%;">
                    <div style="background:rgba(0,0,0,0.5); padding:2rem; border-radius:2rem; width:100%; max-width:400px; text-align:center;">
                        <h2 style="color:white;">Регистрация</h2>
                        <input id="regUsername" class="chat-input" style="width:100%; margin:0.5rem 0;" placeholder="Имя пользователя">
                        <input id="regEmail" class="chat-input" style="width:100%; margin:0.5rem 0;" placeholder="Email">
                        <input id="regPassword" type="password" class="chat-input" style="width:100%; margin:0.5rem 0;" placeholder="Пароль">
                        <button id="registerBtn" class="chat-send" style="width:100%; margin:0.5rem 0;">Зарегистрироваться</button>
                        <p style="color:#aaa;font-size:0.8rem;">Уже есть аккаунт? <span id="toLogin" style="color:#3b6eff;cursor:pointer;">Войти</span></p>
                        <div id="registerMessage" style="color:#ff8888;margin-top:0.5rem;"></div>
                    </div>
                </div>
            `;
            document.getElementById('registerBtn').onclick = () => {
                const username = document.getElementById('regUsername').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                if (users.find(u => u.email === email)) {
                    document.getElementById('registerMessage').innerText = 'Email уже занят';
                    return;
                }
                const newUser = { username, email, password, avatar: null, bio: '' };
                users.push(newUser);
                currentUser = newUser;
                saveAll();
                renderLayer('social');
            };
            document.getElementById('toLogin').onclick = () => renderLogin(container);
        }

        // ==================== СОЦИАЛЬНАЯ СЕТЬ ====================
        function renderSocial(container) {
            const contacts = users.filter(u => u.username !== currentUser.username);
            let contactsHtml = contacts.map(u => `
                <div class="contact-item" data-contact="${u.username}">
                    <div class="contact-avatar" style="background:linear-gradient(135deg,#ff9966,#ff5e62);">${u.username[0].toUpperCase()}</div>
                    <div class="contact-info">
                        <div class="contact-name">${u.username}</div>
                        <div class="contact-preview">Нажмите для чата</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="layer-header">
                    <h2>💬 Социальная сеть</h2>
                    <p>Личные сообщения и каналы</p>
                </div>
                <div class="layer-content">
                    <div class="chat-layout">
                        <div class="contact-list" id="contactList">
                            ${contactsHtml}
                        </div>
                        <div class="chat-window" id="chatWindow">
                            <div class="chat-messages" id="chatMessages">
                                <div style="color:#ddd;text-align:center;margin-top:2rem;">Выберите контакт для начала общения</div>
                            </div>
                            <div class="chat-input-area">
                                <input class="chat-input" id="messageInput" placeholder="Сообщение...">
                                <button class="chat-send" id="sendMessageBtn">Отправить</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            let currentContact = null;
            document.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.contact-item').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentContact = this.dataset.contact;
                    renderMessages(currentContact);
                });
            });

            function renderMessages(contact) {
                const msgContainer = document.getElementById('chatMessages');
                const chatMessages = messages.filter(m =>
                    (m.sender === currentUser.username && m.recipient === contact) ||
                    (m.sender === contact && m.recipient === currentUser.username)
                );
                let html = chatMessages.map(m => `
                    <div class="message-bubble ${m.sender === currentUser.username ? 'own' : ''}">
                        <strong>${m.sender}</strong>: ${m.text}
                        <span style="font-size:0.6rem;color:#aaa;display:block;">${new Date(m.timestamp).toLocaleString()}</span>
                    </div>
                `).join('');
                if (!html) html = '<div style="color:#ddd;text-align:center;margin-top:2rem;">Нет сообщений. Напишите что-нибудь!</div>';
                msgContainer.innerHTML = html;
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }

            document.getElementById('sendMessageBtn').onclick = () => {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text || !currentContact) return;
                const msg = {
                    id: Date.now(),
                    sender: currentUser.username,
                    recipient: currentContact,
                    text: text,
                    timestamp: Date.now()
                };
                messages.push(msg);
                saveAll();
                input.value = '';
                renderMessages(currentContact);
            };
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('sendMessageBtn').click();
            });
        }

        // ==================== ФОРУМ ====================
        function renderForum(container) {
            const categories = forumData.categories;
            const topics = forumData.topics;

            let catsHtml = categories.map(c => `
                <div class="forum-category" data-catid="${c.id}">
                    <h3>${c.name}</h3>
                    <p>${c.desc}</p>
                    <span style="color:#aaa;font-size:0.7rem;">Тем: ${topics.filter(t => t.categoryId === c.id).length}</span>
                </div>
            `).join('');

            let topicsHtml = topics.map(t => {
                const catName = categories.find(c => c.id === t.categoryId)?.name || 'Без категории';
                return `
                    <div class="forum-topic" data-topicid="${t.id}">
                        <div>
                            <div class="title">${t.title}</div>
                            <div class="meta">${catName} • ${t.author} • ${new Date(t.posts[0]?.date || Date.now()).toLocaleDateString()}</div>
                        </div>
                        <div style="color:#aaa;font-size:0.8rem;">${t.posts.length} сообщений</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="layer-header">
                    <h2>📝 Форум</h2>
                    <p>Обсуждайте, задавайте вопросы, делитесь идеями</p>
                </div>
                <div class="layer-content">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <div>
                            <button id="newTopicBtn" class="chat-send" style="padding:0.5rem 1.2rem;">+ Новая тема</button>
                        </div>
                    </div>
                    <div class="forum-categories" id="forumCategories">${catsHtml}</div>
                    <div class="forum-topics" id="forumTopics">${topicsHtml}</div>
                </div>
            `;

            document.querySelectorAll('.forum-topic').forEach(el => {
                el.addEventListener('click', function() {
                    const topicId = parseInt(this.dataset.topicid);
                    showTopicPosts(topicId);
                });
            });

            document.getElementById('newTopicBtn').onclick = () => {
                const title = prompt('Название темы:');
                if (!title) return;
                const categoryId = prompt('ID категории (1-Общий, 2-Помощь, 3-Предложения):');
                const catId = parseInt(categoryId);
                if (!forumData.categories.find(c => c.id === catId)) {
                    alert('Неверная категория');
                    return;
                }
                const newTopic = {
                    id: Date.now(),
                    categoryId: catId,
                    title: title,
                    author: currentUser.username,
                    posts: [{ author: currentUser.username, text: 'Начало темы', date: Date.now() }]
                };
                forumData.topics.push(newTopic);
                saveAll();
                renderForum(container);
            };

            function showTopicPosts(topicId) {
                const topic = forumData.topics.find(t => t.id === topicId);
                if (!topic) return;
                const postsHtml = topic.posts.map(p => `
                    <div style="background:rgba(0,0,0,0.3); padding:0.8rem; border-radius:0.8rem; margin-bottom:0.5rem;">
                        <strong style="color:#ffd700;">${p.author}</strong>
                        <span style="color:#aaa;font-size:0.7rem;margin-left:1rem;">${new Date(p.date).toLocaleString()}</span>
                        <div style="color:white;margin-top:0.3rem;">${p.text}</div>
                    </div>
                `).join('');

                const modal = document.createElement('div');
                modal.style.cssText = `
                    position:fixed; top:0; left:0; width:100%; height:100%;
                    background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
                    display:flex; align-items:center; justify-content:center; z-index:999;
                `;
                modal.innerHTML = `
                    <div style="background:#1e1e2e; padding:2rem; border-radius:2rem; max-width:600px; width:90%; max-height:80vh; overflow-y:auto;">
                        <h2 style="color:white;">${topic.title}</h2>
                        <p style="color:#aaa;">Автор: ${topic.author}</p>
                        <div style="margin:1rem 0;">${postsHtml}</div>
                        <textarea id="replyText" style="width:100%; padding:0.5rem; border-radius:1rem; background:rgba(0,0,0,0.5); color:white; border:1px solid #555;" placeholder="Ваш ответ..."></textarea>
                        <button id="replyBtn" class="chat-send" style="margin-top:0.5rem;">Ответить</button>
                        <button id="closeModalBtn" class="chat-send" style="margin-top:0.5rem; background:#555;">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('replyBtn').onclick = () => {
                    const text = document.getElementById('replyText').value.trim();
                    if (!text) return;
                    topic.posts.push({ author: currentUser.username, text, date: Date.now() });
                    saveAll();
                    modal.remove();
                    showTopicPosts(topicId);
                };
                document.getElementById('closeModalBtn').onclick = () => modal.remove();
            }
        }

        // ==================== МАЙН СЕРВЕР ====================
        function renderMinecraft(container) {
            const data = minecraftData;
            const online = data.players.length;
            const max = data.maxPlayers || 50;

            container.innerHTML = `
                <div class="layer-header">
                    <h2>⛏️ Minecraft сервер</h2>
                    <p>RealWorld • SkyDev • Fantime — копия в реальном времени</p>
                </div>
                <div class="layer-content">
                    <div class="minecraft-stats">
                        <div class="stat-card">
                            <div class="value">${online}</div>
                            <div class="label">Онлайн</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${max}</div>
                            <div class="label">Максимум</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${data.tps || 20}</div>
                            <div class="label">TPS</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${Math.round(online/max*100)}%</div>
                            <div class="label">Загрузка</div>
                        </div>
                    </div>
                    <div style="color:white; margin-bottom:1rem;">Игроки онлайн:</div>
                    <div class="player-list" id="playerList">
                        ${data.players.map(p => `
                            <div class="player-item">
                                <span class="rank" style="color:${p.color || '#aaa'};">[${p.rank}]</span>
                                <span class="name">${p.name}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top:2rem; color:#aaa; font-size:0.8rem; text-align:center;">
                        <i class="fas fa-sync-alt"></i> Данные обновляются автоматически
                        <button id="refreshMinecraft" class="chat-send" style="padding:0.2rem 1rem; margin-left:1rem;">Обновить</button>
                    </div>
                </div>
            `;

            document.getElementById('refreshMinecraft').onclick = () => {
                const names = ['HeroBrine', 'Notch', 'Jeb', 'Dinnerbone', 'Grumm', 'Steve', 'Alex'];
                const ranks = ['Игрок', 'Модератор', 'Админ', 'Владелец'];
                const newPlayer = {
                    name: names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 100),
                    rank: ranks[Math.floor(Math.random() * ranks.length)],
                    color: ['#ffaa00','#ff5555','#55ff55','#aaaaff'][Math.floor(Math.random()*4)]
                };
                minecraftData.players.push(newPlayer);
                saveAll();
                renderMinecraft(container);
            };
        }

        // ==================== НАВИГАЦИЯ ====================
        function initNavigation() {
            const navItems = document.querySelectorAll('.nav-item[data-layer]');
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    this.classList.add('active');
                    const layer = this.dataset.layer;
                    renderLayer(layer);
                });
            });

            document.getElementById('logoutBtn').addEventListener('click', () => {
                currentUser = null;
                saveAll();
                // Убираем активный класс со всех nav-item
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                renderLayer('login');
            });
        }

        // ==================== СТАРТ ====================
        window.onload = function() {
            // Если есть сохранённый пользователь, загружаем соцсеть, иначе логин
            if (currentUser) {
                renderLayer('social');
                // Активируем соответствующий пункт меню
                document.querySelector('.nav-item[data-layer="social"]')?.classList.add('active');
            } else {
                renderLayer('login');
            }
            initNavigation();
        };
    </script>
</body>
</html>
